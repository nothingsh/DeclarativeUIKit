name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
              | select(.name | startswith("iPhone"))][0].udid')
          echo "IOS_SIMULATOR_ID=$udid" >> "$GITHUB_ENV"

      # Complete concurrency checking with warnings as errors, so a new data race
      # warning fails the build.
      - name: Test
        run: scripts/test-ios.sh SWIFT_STRICT_CONCURRENCY=complete SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      # The package and its tests must also compile in Swift 6 language mode.
      - name: Build in Swift 6 language mode
        run: |
          xcodebuild -scheme DeclarativeUIKit -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath .build/swift6 \
            SWIFT_VERSION=6 SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build-for-testing
